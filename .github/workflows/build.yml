name: Construire l'IPA

on:
  push:
    branches-ignore: [build-log]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler (sans signature)
        run: |
          set -o pipefail
          xcodebuild \
            -project ObjectifPrix.xcodeproj \
            -scheme ObjectifPrix \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee build.log

      - name: Garder le journal de compilation (branche build-log)
        if: always()
        run: |
          mkdir -p /tmp/log
          cp build.log /tmp/log/build.log 2>/dev/null || echo "pas de journal" > /tmp/log/build.log
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" /tmp/log/build.log | head -200 > /tmp/log/errors.txt || true
          cd /tmp/log
          git init -q
          git config user.name "build-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -q -b build-log
          git add .
          git commit -q -m "journal ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-log

      - name: Fabriquer le fichier .ipa
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name "*.app" | head -n 1)
          echo "Application trouvée : $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ObjectifPrix.ipa Payload

      - name: Publier l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: ObjectifPrix-ipa
          path: ObjectifPrix.ipa
