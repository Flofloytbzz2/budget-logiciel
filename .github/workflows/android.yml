name: APK Android

on:
  push:
    branches-ignore: [build-log, build-log-android]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Licences Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compiler l'APK
        working-directory: android
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Garder le journal de compilation (branche build-log-android)
        if: always()
        run: |
          mkdir -p /tmp/log
          cp build.log /tmp/log/build.log 2>/dev/null || echo "pas de journal" > /tmp/log/build.log
          grep -E "^e: |error:|BUILD (SUCCESSFUL|FAILED)|What went wrong|Execution failed" -A2 /tmp/log/build.log | head -300 > /tmp/log/errors.txt || true
          cd /tmp/log
          git init -q
          git config user.name "build-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -q -b build-log-android
          git add .
          git commit -q -m "journal ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-log-android

      - uses: actions/upload-artifact@v4
        with:
          name: ObjectifPrix-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier dans « Releases »
        if: github.ref_name == 'main' || github.ref_name == 'android-apk'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ObjectifPrix.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest ObjectifPrix.apk \
            --title "Objectif Prix pour Android (APK)" \
            --notes "Télécharge ObjectifPrix.apk sur ton téléphone et ouvre-le (autorise l'installation depuis cette source si Android le demande)."
