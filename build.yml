name: Construire l'IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler (sans signature)
        run: |
          xcodebuild \
            -project ObjectifPrix.xcodeproj \
            -scheme ObjectifPrix \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Fabriquer le fichier .ipa
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name "*.app" | head -n 1)
          echo "Application trouvée : $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ObjectifPrix.ipa Payload

      - name: Publier l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: ObjectifPrix-ipa
          path: ObjectifPrix.ipa
